<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teto Relay</title>
<style>
/* Flat and plain, the way system apps look: solid cards on a solid page, one
   accent colour, no blur, glow or gradients. The accent is the only colour on
   the page and it comes from the selected voicebank's artwork (applyAccent),
   so each voice still brings its own look. Light is the default; dark follows
   the system until the toggle says otherwise. */
:root{
  /* Native widgets - the select popup, scrollbars - follow this. Without it
     the open dropdown list stays white on a dark page. */
  color-scheme:light;
  --bg:#f5f5f7; --card:#fff; --sink:#f0f0f3; --line:#e2e2e7;
  --text:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93;
  --accent:#d31b45; --accent-weak:rgba(211,27,69,.12);
  --warn-bg:#fff6e5; --warn-line:#f0c46b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --sink:#2c2c2e; --line:#38383a;
  --text:#f5f5f7; --muted:#a1a1a6; --faint:#8e8e93;
  --accent:#ff4a70; --accent-weak:rgba(255,74,112,.18);
  --warn-bg:#3a2c10; --warn-line:#8a6420;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --sink:#2c2c2e; --line:#38383a;
  --text:#f5f5f7; --muted:#a1a1a6; --faint:#8e8e93;
  --accent:#ff4a70; --accent-weak:rgba(255,74,112,.18);
  --warn-bg:#3a2c10; --warn-line:#8a6420;
}
*{box-sizing:border-box}
html,body{background-color:var(--bg)}
body{margin:0;color:var(--text);font-size:15px;line-height:1.4;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.mark{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--faint);font-style:normal}
.live .mark i{background:var(--accent)}
.spacer{margin-left:auto}
/* A segmented control, like a system settings switch. */
.tabs{display:flex;padding:2px;background:var(--sink);border-radius:9px}
.tabs button{background-color:transparent;color:var(--muted);padding:6px 16px;border-radius:7px;
  font-size:13px;font-weight:600}
.tabs button[aria-selected=true]{background-color:var(--card);color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tabs button:not([aria-selected=true]):hover{color:var(--text);background-color:transparent}
.state{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.state i{width:7px;height:7px;border-radius:50%;background:var(--faint);font-style:normal}
.live .state i{background:var(--accent);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:24px auto;padding:0 24px 56px;display:grid;
  grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.col-voice{display:flex;flex-direction:column;gap:20px;position:sticky;top:76px}
.col-set{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:0 16px 48px}
  .col-voice{position:static}
}
.pane{background:var(--card);border:1px solid var(--line);border-radius:14px}
.bar.pane{border-radius:0;border-width:0 0 1px}
.tag{font-size:13px;font-weight:600;color:var(--muted);margin:0}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:14px;font-weight:600;border:0;border-radius:980px;
  padding:8px 18px;cursor:pointer;background-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.live #toggle{background-color:var(--sink);color:var(--text)}
.icon{background-color:transparent;color:var(--muted);padding:0;width:34px;height:34px;
  border-radius:50%;display:grid;place-items:center}
.icon:hover{background-color:var(--sink);color:var(--text);filter:none}
.ghost{background-color:transparent;color:var(--text);font-weight:500;padding:8px 14px}
.ghost:hover{background-color:var(--sink);filter:none}

/* ---------- the voice card ---------- */
.voice{padding:16px;display:flex;flex-direction:column;gap:12px}
.portrait{aspect-ratio:1;border-radius:10px;overflow:hidden;background-color:var(--sink);
  display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.vname{font-size:18px;font-weight:700;margin:0;line-height:1.25}
.vmeta{font-size:13px;color:var(--muted);margin:3px 0 0}
.voice select{width:100%;background-color:var(--sink);border:1px solid transparent;color:var(--text);
  font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;cursor:pointer}
/* A file input is unstyleable and says "No file chosen"; the label is the
   button and the real input sits behind it. */
.addvoice{position:relative;display:block}
.addvoice input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.addvoice span{display:block;text-align:center;font-size:14px;color:var(--muted);
  padding:9px;border:1px dashed var(--line);border-radius:10px}
.addvoice:hover span{color:var(--accent);border-color:var(--accent)}

/* ---------- what was heard and sung ---------- */
.stage{padding:18px 20px 20px}
.stagehead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.heard{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin:0;
  overflow-wrap:break-word}
.kana{font-family:"Yu Gothic UI","Meiryo",sans-serif;font-size:18px;line-height:1.5;
  color:var(--muted);margin:8px 0 0;overflow-wrap:break-word}
.sungtag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-weak);
  border-radius:980px;padding:2px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.idle{font-size:16px;color:var(--muted);margin:0;line-height:1.5}
.idle kbd{font:inherit;font-size:13px;font-weight:600;background:var(--sink);border-radius:6px;
  padding:2px 8px;color:var(--text);border:1px solid var(--line)}
.roll{margin-top:18px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.rollinner{min-width:max-content;position:relative}
.ribbon{position:absolute;left:0;top:6px;pointer-events:none;overflow:visible}
.ribbon path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;
  stroke-linecap:round;opacity:.6}
/* Every note sits at the pitch it is sung at, so a phrase reads as a melody.
   x is note order (the payload carries no durations), y is the tone. */
.notes{position:relative;height:132px;margin-top:6px}
.lane{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.lane s{position:absolute;left:0;top:-15px;font-size:10px;color:var(--faint);text-decoration:none;
  font-variant-numeric:tabular-nums}
.note{position:absolute;background-color:var(--accent-weak);border-radius:7px;text-align:center;
  padding:5px 0 4px;animation:rise .25s backwards}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.note b{font-family:"Yu Gothic UI","Meiryo",sans-serif;font-size:15px;font-weight:500;display:block;
  line-height:1.15}
.note s{font-size:10px;color:var(--muted);display:block;text-decoration:none;
  font-variant-numeric:tabular-nums}
.meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:14px;
  margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.meters dt{font-size:12px;color:var(--muted)}
.meters dd{margin:3px 0 0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.deckhead{padding:16px 20px 0}
.deck{padding:4px 20px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:4px 24px}
.ctl{padding:12px 0}
.ctl label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.ctl .help{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.slide{display:flex;align-items:center;gap:10px}
.readout{font-size:15px;font-weight:600;min-width:58px;text-align:center;
  font-variant-numeric:tabular-nums}
/* -/+ beside a slider: one exact step, which a thin track makes fiddly. */
.step{background-color:var(--sink);color:var(--text);padding:0;width:30px;height:30px;
  border-radius:50%;font-size:17px;line-height:1;flex:none}
.step:hover{filter:brightness(.95)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:none;
  cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:#fff;margin-top:-8px;border:0;
  box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
input[type=text],input[type=number],select.box{width:100%;background:var(--sink);color:var(--text);
  border:1px solid transparent;border-radius:10px;padding:9px 12px;font:inherit;font-size:15px}
select.box{cursor:pointer}
select option{background:var(--card);color:var(--text)}
input:focus-visible,select.box:focus-visible{outline:0;border-color:var(--accent)}
/* A switch, like a system toggle. */
input[type=checkbox]{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);
  position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input[type=checkbox]:checked{background-color:var(--accent)}
input[type=checkbox]:checked::after{transform:translateX(18px)}

/* ---------- all settings ---------- */
.advbar{display:flex;align-items:center;gap:6px}
.adv{display:none;padding:4px 20px 18px}
.open .adv{display:block}
.advtoggle span{display:inline-block;transition:transform .2s;margin-right:8px;font-size:10px}
.open .advtoggle span{transform:rotate(90deg)}
.group{padding:16px 0;border-top:1px solid var(--line)}
.group:first-child{border-top:0}
details.group>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;
  flex-wrap:wrap}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::before{content:"\25B6";font-size:10px;color:var(--muted);
  transition:transform .2s;display:inline-block}
details.group[open]>summary::before{transform:rotate(90deg)}
.gtitle{font-size:17px;font-weight:700;color:var(--text)}
.gnote{font-size:13px;color:var(--muted)}
details.group[open]>.grouprows{margin-top:6px}
.grouprows{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 24px}
#log{margin:10px 0 0;background:var(--sink);border-radius:10px;padding:12px;height:200px;
  overflow:auto;font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:12px;
  line-height:1.6;white-space:pre-wrap;color:var(--muted)}
/* A snackbar: dark on light, light on dark. */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);z-index:60;
  padding:11px 18px;font-size:14px;border-radius:10px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;background:var(--text);color:var(--bg);
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Problems the relay is having right now, and the setup check. */
.alert{margin:0;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.5;
  background:var(--warn-bg);border:1px solid var(--warn-line)}
.alert p{margin:0}.alert p+p{margin-top:6px}
.checks{margin:10px 0 0;font:12px/1.55 "Cascadia Mono",Consolas,ui-monospace,monospace;
  white-space:pre-wrap;max-height:320px;overflow:auto}
@media (max-width:720px){
  .bar{padding:10px 16px;gap:10px}
  .heard{font-size:21px} .kana{font-size:16px}
  .stage,.deck,.adv,.deckhead{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
<header class="bar pane">
  <span class="mark" id="mark"><i></i>Teto Relay</span>
  <div class="tabs" role="tablist" aria-label="Engine">
    <button role="tab" id="tab-utau" aria-selected="true">UTAU</button>
    <button role="tab" id="tab-voice" aria-selected="false">Voice</button>
  </div>
  <span class="spacer"></span>
  <span class="state"><i></i><span id="stateText">stopped</span></span>
  <button class="icon" id="theme" title="Switch theme" aria-label="Switch theme"></button>
  <button id="toggle">Start</button>
</header>

<div class="wrap">
  <div class="col-voice">
    <section class="voice pane">
      <div class="portrait"><img id="avatar" alt=""></div>
      <div>
        <p class="vname" id="vname">&nbsp;</p>
        <p class="vmeta" id="vmeta"></p>
      </div>
      <select id="bank" aria-label="Choose voicebank"></select>
      <label class="addvoice" id="addvoice">
        <input type="file" id="up-bank" accept=".zip">
        <span id="addvoicetext">Add a voicebank</span>
      </label>
      <!-- Same control, different engine: in Voice mode the identity is an RVC
           model, so the picker and the upload change with the tab. -->
      <label class="addvoice" id="addrvc" hidden>
        <input type="file" id="up-rvc" accept=".pth,.index">
        <span>Add an RVC voice (.pth)</span>
      </label>
      <p class="help" id="up-status"></p>
    </section>

    <div class="alert" id="alert" hidden></div>
    <section class="stage pane">
      <div class="stagehead">
        <p class="tag" id="stagetag">what she sang</p>
      </div>
      <div id="hero"></div>
      <div class="roll" id="roll" hidden>
        <div class="rollinner">
          <svg class="ribbon" id="ribbon" aria-hidden="true"></svg>
          <div class="notes" id="notes"></div>
        </div>
      </div>
      <dl class="meters" id="meters"></dl>
    </section>
  </div>

  <div class="col-set">
    <section class="pane">
      <p class="tag deckhead">most used - changes apply straight away</p>
      <div class="deck" id="deck"></div>
    </section>
    <div class="advbar">
      <button class="ghost advtoggle" id="advtoggle"><span>&#9654;</span>All settings</button>
      <span class="spacer"></span>
      <button class="ghost" id="doctor" title="Check OpenUtau, .NET, devices, voicebanks and GPU">Check setup</button>
      <button class="ghost" id="quit" title="Stop Teto Relay and close the control panel">Quit</button>
    </div>
    <div class="adv pane" id="adv">
      <div class="group" id="checkgroup" hidden>
        <p class="tag">setup check</p>
        <pre class="checks" id="checks"></pre>
      </div>
      <div id="groups"></div>
      <div class="group">
        <p class="tag">activity</p>
        <pre id="log">Waiting for the relay to start.</pre>
      </div>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* Every request carries this header. A page on another site cannot add a
   custom header to a request here without a CORS preflight, which this server
   never approves - that is what stops a website from driving the panel. */
const _fetch=window.fetch.bind(window);
window.fetch=(url,opts={})=>_fetch(url,{...opts,headers:{...(opts.headers||{}),'X-Teto-Relay':'1'}});
let cfg={}, meta={}, lastKey='';
const $=id=>document.getElementById(id);
const app=()=>$('app');

/* ---------- theme: follow the system until told otherwise ---------- */
/* Drawn rather than typed: the sun and moon code points render as a weak
   asterisk in the Windows UI font. */
const SUN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"'+
  ' stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/>'+
  '<path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6'+
  'M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';
const MOON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"'+
  ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+
  '<path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>';
function applyTheme(mode){
  if(mode) document.documentElement.setAttribute('data-theme',mode);
  else document.documentElement.removeAttribute('data-theme');
  const dark=(mode==='dark')||(!mode&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('theme').innerHTML=dark?SUN:MOON;
  $('theme').title=dark?'Switch to light':'Switch to dark';
}
(function(){let saved=null;try{saved=localStorage.getItem('teto.theme');}catch(e){}
  applyTheme(saved);})();
$('theme').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||
    (!document.documentElement.hasAttribute('data-theme')&&
      matchMedia('(prefers-color-scheme:dark)').matches);
  const next=dark?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem('teto.theme',next);}catch(e){}
};

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800);
}
function labelOf(k){return (meta.labels&&meta.labels[k])?meta.labels[k][0]:k.replace(/_/g,' ');}
function helpOf(k){return (meta.labels&&meta.labels[k])?meta.labels[k][1]:'';}
function fmt(k,v){
  if(meta.seconds&&meta.seconds.includes(k)) return Math.round(v*1000)+' ms';
  if(k.endsWith('_ms')) return v+' ms';
  if(k==='transpose') return (v>0?'+':'')+v;
  return String(Math.round(v*100)/100);
}
function paint(el){const a=+el.min,b=+el.max;el.style.setProperty('--pct',((el.value-a)/(b-a)*100)+'%');}

async function load(){
  const d=await (await fetch('api/config')).json();
  cfg=d.config; meta=d.meta;
  renderPicker(); renderDeck(); renderGroups(); paintEngine();
}
function renderPicker(){
  const pick=$('bank'); pick.innerHTML='';
  for(const b of (meta.banks||[])){
    const o=document.createElement('option'); o.value=b.key; o.textContent=b.key;
    if(b.key===cfg.voicebank) o.selected=true; pick.appendChild(o);
  }
  showBank(cfg.voicebank);
}
function showBank(key){
  const b=(meta.banks||[]).find(x=>x.key===key), img=$('avatar');
  // No such bank (none installed yet): no picture to ask for.
  img.hidden=!b;
  img.onerror=()=>{img.hidden=true;};
  if(b) img.src='api/bank-image?bank='+encodeURIComponent(key)+'&t='+Date.now();
  img.alt=b?('Voicebank '+b.key):'';
  img.title='';
  /* The name and what it is were a tooltip nobody would find. */
  $('vname').textContent=b?b.name:key;
  $('vmeta').textContent=b?(b.flavour+' · '+b.entries+' samples · sings '+b.lyrics):'';
  applyAccent(b&&b.accent);
}
/* Each voice colours the panel with the main colour of its own artwork, so a
   bank you add brings its own look instead of borrowing Teto's red. One solid
   colour, plus a pale version of it for note blocks and tags. */
function applyAccent(hex){
  const root=document.documentElement;
  if(!hex){root.style.removeProperty('--accent'); root.style.removeProperty('--accent-weak'); return;}
  root.style.setProperty('--accent',hex);
  const n=parseInt(hex.slice(1),16);
  root.style.setProperty('--accent-weak','rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+',.14)');
}

/* Devices are a name substring in config, so whatever is saved stays an option
   even when it is shorter than the full device name. */
function deviceOptions(k){
  const kind=(k==='input_device')?'input':'output';
  const list=((meta.devices||{})[kind]||[]).slice();
  const current=cfg[k]||'';
  if(current&&!list.some(n=>n===current)) list.unshift(current);
  return {list:list,blank:(kind==='input')?'System default':''};
}
function control(k){
  const wrap=document.createElement('div'); wrap.className='ctl';
  const lab=document.createElement('label'); lab.textContent=labelOf(k); lab.htmlFor='f-'+k;
  wrap.appendChild(lab);
  const range=meta.ranges?meta.ranges[k]:null;
  const isDevice=(k==='input_device'||k==='output_device');
  let inp,out=null;
  if(isDevice&&((meta.devices||{}).input||[]).length){
    const {list,blank}=deviceOptions(k);
    inp=document.createElement('select'); inp.className='box';
    if(blank!==''){const o=document.createElement('option'); o.value=''; o.textContent=blank;
      if(!cfg[k]) o.selected=true; inp.appendChild(o);}
    for(const n of list){
      const o=document.createElement('option'); o.value=n; o.textContent=n;
      if(cfg[k]===n) o.selected=true; inp.appendChild(o);
    }
    wrap.appendChild(inp);
  } else if(meta.choices[k]){
    inp=document.createElement('select'); inp.className='box';
    // A value the list does not offer (e.g. "base.en" from an older config)
    // is kept as its own option. Left out, the select showed the first choice
    // instead, and Save quietly wrote that over the real setting.
    const choices=[...meta.choices[k]];
    if(cfg[k]!=null&&cfg[k]!==''&&!choices.map(String).includes(String(cfg[k]))) choices.unshift(cfg[k]);
    for(const opt of choices){
      const o=document.createElement('option'); o.value=opt; o.textContent=opt;
      if(String(cfg[k])===String(opt)) o.selected=true; inp.appendChild(o);
    }
    wrap.appendChild(inp);
  } else if(typeof cfg[k]==='boolean'){
    inp=document.createElement('input'); inp.type='checkbox'; inp.checked=cfg[k];
    wrap.appendChild(inp);
  } else if(range&&typeof cfg[k]==='number'){
    inp=document.createElement('input'); inp.type='range';
    inp.min=range[0]; inp.max=range[1]; inp.step=range[2]; inp.value=cfg[k];
    out=document.createElement('span'); out.className='readout'; out.textContent=fmt(k,cfg[k]);
    inp.addEventListener('input',()=>{out.textContent=fmt(k,+inp.value); paint(inp);});
    const slider=inp;
    const step=(sign,label)=>{
      const b=document.createElement('button'); b.type='button'; b.className='step';
      b.textContent=label; b.setAttribute('aria-label',(sign<0?'Lower ':'Raise ')+labelOf(k));
      b.onclick=()=>{
        // Rounded to the step, so 0.05 steps don't drift into 0.30000000000000004.
        const s=+slider.step, raw=+slider.value+sign*s;
        const next=Math.min(+slider.max,Math.max(+slider.min,Math.round(raw/s)*s));
        if(next===+slider.value) return;
        slider.value=next; out.textContent=fmt(k,+slider.value); paint(slider);
        slider.dispatchEvent(new Event('change',{bubbles:true}));
      };
      return b;
    };
    const row=document.createElement('div'); row.className='slide';
    row.appendChild(step(-1,'\u2212')); row.appendChild(inp); row.appendChild(step(1,'+'));
    row.appendChild(out); wrap.appendChild(row);
  } else {
    inp=document.createElement('input');
    inp.type=(typeof cfg[k]==='number')?'number':'text';
    if(typeof cfg[k]==='number') inp.step='any';
    inp.value=cfg[k]===null?'':cfg[k];
    wrap.appendChild(inp);
  }
  inp.id='f-'+k; inp.dataset.key=k; inp.className=(inp.className||'')+' field';
  const help=helpOf(k);
  if(help){const s=document.createElement('span'); s.className='help'; s.textContent=help;
    wrap.appendChild(s);}
  if(inp.type==='range') paint(inp);
  /* Every setting applies as you change it. There used to be a Save button
     for everything below the main screen, and a change that sat unsaved
     behind it looked exactly like a change that did nothing. */
  inp.addEventListener('change',()=>saveOne(k));
  return wrap;
}
function renderDeck(){
  const host=$('deck'); host.innerHTML='';
  for(const k of (meta.essentials||[])) host.appendChild(control(k));
}
async function saveOne(k){
  const value=collect()[k];
  if(value===undefined) return;
  cfg[k]=value;
  const d=await (await fetch('api/config',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:value})})).json();
  if(!d.ok){ toast('Could not save: '+d.error); return; }
  if(k==='mode'){ paintEngine(); renderGroups(); }
  toast(labelOf(k)+(d.restart&&d.restart.length ? ': saved \u2014 press Stop, then Start, to use it' : ': applied'));
}
/* The two engines are different machines and most settings belong to exactly
   one of them. Showing RVC sliders while UTAU is singing - or note timing while
   it isn't - is most of why this page was hard to read. Hide what the active
   engine cannot use; nothing is lost, since switching the tab brings it back. */
function engineOf(){ return (cfg.mode||'utau').toLowerCase(); }
/* Each group folds. The ones most people never need start folded, and
   whatever you open or close is remembered. */
function groupOpen(name,info){
  try{const v=localStorage.getItem('teto.group.'+name); if(v!==null) return v==='1';}catch(e){}
  return !info.collapsed;
}
function renderGroups(){
  const host=$('groups'); host.innerHTML='';
  for(const [name,keys] of Object.entries(meta.groups)){
    if(!keys.length) continue;
    const info=(meta.group_info||{})[name]||{};
    // Each engine's own groups only: RVC sliders mean nothing while UTAU sings.
    if(info.engine && info.engine!==engineOf()) continue;
    const sec=document.createElement('details'); sec.className='group';
    sec.open=groupOpen(name,info);
    sec.addEventListener('toggle',()=>{
      try{localStorage.setItem('teto.group.'+name,sec.open?'1':'0');}catch(e){}});
    const sum=document.createElement('summary');
    const t=document.createElement('span'); t.className='gtitle'; t.textContent=name;
    sum.appendChild(t);
    if(info.note){const n=document.createElement('span'); n.className='gnote'; n.textContent=info.note;
      sum.appendChild(n);}
    sec.appendChild(sum);
    const rows=document.createElement('div'); rows.className='grouprows';
    for(const k of keys) rows.appendChild(control(k));
    sec.appendChild(rows); host.appendChild(sec);
  }
}
function collect(){
  const out={};
  for(const el of document.querySelectorAll('.field')){
    const k=el.dataset.key;
    if(el.type==='checkbox') out[k]=el.checked;
    else if(el.type==='number'||el.type==='range') out[k]=el.value===''?null:Number(el.value);
    else out[k]=el.value;
  }
  return out;
}

function tag(t){const s=document.createElement('span'); s.className='sungtag'; s.textContent=t; return s;}
function renderHero(d){
  const key=JSON.stringify([d.heard,d.kana,d.notes,d.running,d.engine,d.last]);
  if(key===lastKey) return;
  lastKey=key;
  const hero=$('hero'), roll=$('roll');
  hero.innerHTML='';
  // Voice mode transcribes nothing and sings no notes - it replays what you
  // said in her timbre - so the note roll and the two lyric lines have nothing
  // to show. Say what happened instead of showing an empty stage.
  if(d.engine==='voice'){
    roll.hidden=true;
    const p=document.createElement('p');
    if(d.last){
      p.className='heard'; p.textContent=d.last;
      p.appendChild(tag('your delivery, her voice'));
    } else {
      p.className='idle';
      if(d.running){
        // Built from nodes: the key name comes from the config file.
        const kbd=document.createElement('kbd'); kbd.textContent=String(cfg.ptt_key||'F8').toUpperCase();
        p.append('Hold ',kbd,' and speak - you will come back as Teto.');
      } else p.textContent='Start the relay to talk in Teto\u2019s voice.';
    }
    hero.appendChild(p);
    return;
  }
  if(!d.notes.length){
    const p=document.createElement('p'); p.className='idle';
    if(d.running){
      // Built from nodes: the key name comes from the config file.
      const kbd=document.createElement('kbd'); kbd.textContent=String(cfg.ptt_key||'F8').toUpperCase();
      p.append('Hold ',kbd,' and speak.');
    }
    else p.textContent='Start the relay, then hold your push-to-talk key and speak.';
    hero.appendChild(p); roll.hidden=true; return;
  }
  const sung=d.lyrics==='morae';
  const en=document.createElement('p'); en.className='heard'; en.textContent=d.heard||'\u2014';
  if(!sung) en.appendChild(tag('sung'));
  hero.appendChild(en);
  if(d.kana){
    const jp=document.createElement('p'); jp.className='kana'; jp.textContent=d.kana;
    if(sung) jp.appendChild(tag('sung'));
    hero.appendChild(jp);
  }
  roll.hidden=false;
  renderNotes(d.notes);
}
/* Where a tone sits in the lane, 0 at the bottom. Shared by the blocks and the
   ribbon so they cannot drift apart. A phrase on one note would divide by zero
   and also deserves to sit in the middle rather than on the floor, so the span
   never goes below four semitones. */
const ROLL={h:132, box:34, gap:5, pad:20};
function toneY(tone,lo,span){
  return ROLL.pad + (1-(tone-lo)/span)*(ROLL.h-ROLL.box-ROLL.pad*2);
}
function rollRange(notes){
  const t=notes.map(n=>n.tone), lo=Math.min(...t), hi=Math.max(...t);
  const span=Math.max(hi-lo,4), mid=(lo+hi)/2;
  return {lo:mid-span/2, span:span};
}
function renderNotes(notes){
  const host=$('notes'); host.innerHTML='';
  const {lo,span}=rollRange(notes);
  host.style.width=(notes.length*(ROLL.box+ROLL.gap))+'px';
  // Two rules mark the range being sung, so the heights mean something.
  [lo+span,lo].forEach((tone,i)=>{
    const l=document.createElement('div'); l.className='lane';
    l.style.top=(toneY(tone,lo,span)+ROLL.box/2)+'px';
    const s=document.createElement('s'); s.textContent=Math.round(tone);
    l.appendChild(s); host.appendChild(l);
  });
  notes.forEach((n,i)=>{
    const d=document.createElement('div'); d.className='note';
    d.style.animationDelay=Math.min(i*20,420)+'ms';
    d.style.left=(i*(ROLL.box+ROLL.gap))+'px';
    d.style.top=toneY(n.tone,lo,span)+'px';
    d.style.width=ROLL.box+'px';
    d.title=n.lyric+' at MIDI '+n.tone;
    const b=document.createElement('b'); b.textContent=n.lyric;
    const s=document.createElement('s'); s.textContent=n.tone;
    d.appendChild(b); d.appendChild(s); host.appendChild(d);
  });
  requestAnimationFrame(()=>drawRibbon(notes));
}
/* One hairline through the blocks, at the same coordinates they use, so the
   contour reads across the gaps. The old version drew a second curve above the
   row; now that the blocks carry the pitch themselves, a separate chart of the
   same numbers would just be decoration. */
function drawRibbon(notes){
  const svg=$('ribbon');
  if(!notes.length){svg.innerHTML='';return;}
  const w=notes.length*(ROLL.box+ROLL.gap), h=ROLL.h;
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const {lo,span}=rollRange(notes);
  const pts=notes.map((n,i)=>[i*(ROLL.box+ROLL.gap)+ROLL.box/2,
    toneY(n.tone,lo,span)+ROLL.box/2]);
  const dpath=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  svg.innerHTML='<path d="'+dpath+'"></path>';
  const line=svg.querySelector('path');
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&line.getTotalLength){
    const len=line.getTotalLength();
    line.animate([{strokeDasharray:len,strokeDashoffset:len},{strokeDasharray:len,strokeDashoffset:0}],
      {duration:Math.min(160+notes.length*22,900),easing:'ease-out'});
  }
}
function renderMeters(s){
  const m=$('meters'); m.innerHTML='';
  for(const [k,v] of [['heard',s.speech!=null?s.speech+'s':'\u2014'],
                      ['analysed',s.analyse!=null?s.analyse+'s':'\u2014'],
                      ['rendered',s.render!=null?s.render+'s':'\u2014'],
                      ['to sound',s.behind!=null?s.behind+'s':'\u2014'],
                      ['pitch',s.method||'\u2014']]){
    const d=document.createElement('div');
    const dt=document.createElement('dt'); dt.textContent=k;
    const dd=document.createElement('dd'); dd.textContent=v;
    if(k==='pitch') dd.style.fontSize='12px';
    d.appendChild(dt); d.appendChild(dd); m.appendChild(d);
  }
}

$('bank').onchange=async e=>{
  const key=e.target.value;
  const d=await (await fetch('api/voicebank',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({bank:key})})).json();
  if(d.ok){cfg.voicebank=key; showBank(key);
    toast(d.applied?('Now singing as '+key):(key+' loads when you start the relay.'));
  } else toast('Could not switch: '+d.error);
};
$('toggle').onclick=async e=>{
  const btn=e.currentTarget, starting=btn.dataset.state!=='running';
  btn.disabled=true; btn.textContent=starting?'Starting':'Stopping';
  try{
    const d=await (await fetch(starting?'api/start':'api/stop',{method:'POST'})).json();
    if(d&&d.ok===false) toast('Could not start: '+d.error);
  }catch(err){toast('Could not reach the relay.');}
  btn.disabled=false; poll();
};
/* ---------- engine tabs ----------
   The tab is the mode setting, so it writes straight through and re-renders
   the parts of the page whose meaning depends on it: which identity the voice
   card shows, and which settings apply. */
function paintEngine(){
  const eng=engineOf(), utau=eng!=='voice';
  $('tab-utau').setAttribute('aria-selected',String(utau));
  $('tab-voice').setAttribute('aria-selected',String(!utau));
  $('bank').hidden=!utau;
  $('addvoice').hidden=!utau;
  $('addrvc').hidden=utau;
  $('stagetag').textContent=utau?'what she sang':'what she said';
  if(!utau){
    // In voice mode the identity is the RVC model, not a voicebank.
    const m=String(cfg.rvc_model||'').split(/[\\/]/).pop().replace(/\.pth$/i,'');
    $('vname').textContent=m||'No voice model';
    $('vmeta').textContent=m?'RVC · your delivery, her timbre':'Add a .pth to sing in a voice';
  } else if(meta.banks){
    showBank(cfg.voicebank);
  }
}
async function setEngine(mode){
  if(engineOf()===mode) return;
  cfg.mode=mode;
  paintEngine(); renderDeck(); renderGroups();
  await fetch('api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode:mode})});
  toast(mode==='voice'?'Voice engine':'UTAU engine');
}
$('tab-utau').onclick=()=>setEngine('utau');
$('tab-voice').onclick=()=>setEngine('voice');

/* Uploads: the body is the file and the name rides in the query, so there is
   no multipart parser on either end. */
async function upload(kind, file, note){
  if(!file) return;
  const status=$('up-status');
  status.textContent='Uploading '+file.name+' ('+(file.size/1e6).toFixed(0)+' MB)…';
  try{
    const r=await fetch('api/install/'+kind+'?name='+encodeURIComponent(file.name),
      {method:'POST',body:file});
    const d=await r.json();
    if(!d.ok){status.textContent=d.error; toast('Could not install it'); return;}
    status.textContent=note(d.installed);
    toast('Installed');
    await load();                       // the picker and accents refresh
  }catch(err){ status.textContent='Upload failed: '+err; }
}
$('up-bank').onchange=e=>upload('voicebank',e.target.files[0],
  i=>'Installed '+i.name+' — '+i.samples+' samples. Pick it in the top bar.');
$('up-rvc').onchange=e=>upload('rvc',e.target.files[0],
  i=>i.kind==='index' ? 'Index saved; it will be used with the current model.'
    : 'Installed '+i.name+' — '+i.version+', '+i.sample_rate+' Hz'+(i.pitch?', pitched':'')+
      '. Set Engine to voice to use it.');

$('advtoggle').onclick=()=>{
  const open=app().classList.toggle('open');
  $('advtoggle').innerHTML='<span>&#9654;</span>'+(open?'Hide settings':'All settings');
  try{localStorage.setItem('teto.adv',open?'1':'0');}catch(e){}
};
if((()=>{try{return localStorage.getItem('teto.adv')==='1';}catch(e){return false;}})()){
  app().classList.add('open');
  $('advtoggle').innerHTML='<span>&#9654;</span>Hide settings';
}

function renderAlert(h){
  const box=$('alert'); box.textContent='';
  for(const problem of (h.problems||[])){
    const p=document.createElement('p'); p.textContent=problem; box.appendChild(p);
  }
  box.hidden=!(h.problems||[]).length;
}
$('quit').onclick=async()=>{
  if(!confirm('Quit Teto Relay?')) return;
  try{await fetch('api/quit',{method:'POST'});}catch(e){}
  document.body.textContent='Teto Relay has stopped. You can close this tab.';
};
$('doctor').onclick=async()=>{
  const out=$('checks'); $('checkgroup').hidden=false; out.textContent='Checking...';
  app().classList.add('open');
  try{
    const d=await (await fetch('api/doctor')).json();
    out.textContent=d.text;
    toast(d.ok?'Setup looks ready.':'Some things need fixing - see "setup check".');
  }catch(e){out.textContent='Could not run the check: '+e;}
};

async function poll(){
  try{
    const d=await (await fetch('api/status')).json();
    app().classList.toggle('live',d.running);
    if(d.version) $('mark').title='Teto Relay '+d.version;
    const btn=$('toggle');
    btn.dataset.state=d.running?'running':'stopped';
    btn.textContent=d.running?'Stop':'Start';
    $('stateText').textContent=d.running?(d.paused?'paused':'listening'):'stopped';
    const voice=d.engine==='voice';
    $('stagetag').textContent=voice?'now speaking':'heard';
    // The voicebank picker does nothing in voice mode - the RVC model is the
    // voice - so it is disabled rather than left looking live.
    const pick=$('bank');
    pick.disabled=voice;
    pick.title=voice?'Voice mode uses the RVC model, not a voicebank':'';
    // Only when the picker can actually show that bank; with none installed
    // this used to refetch a missing picture every second.
    if(d.bank&&d.bank!==pick.value&&[...pick.options].some(o=>o.value===d.bank)){
      pick.value=d.bank; showBank(d.bank);
    }
    renderHero(d); renderMeters(d.stats||{}); renderAlert(d.health||{});
    const box=$('log');
    const stick=box.scrollTop+box.clientHeight>=box.scrollHeight-24;
    box.textContent=d.log.join('\n')||'Waiting for the relay to start.';
    if(stick) box.scrollTop=box.scrollHeight;
  }catch(e){}
}
load().then(poll); setInterval(poll,1000);
</script>
